;//////////////////////////////////////////////////////////////////////////////
; FILE: ZuluGOIntro.ini ////////////////////////////////////////////////////////
; The GeneralsZulu insignia shown on the Zulu GO startup screen (Intro.cpp).
; Shipped inside Zulu.modbig, so the block is additive to the stock
; MappedImages. The texture is at Art/Textures/ZuluGOLogo.tga -- language
; neutral on purpose, unlike the Data/English textures beside it, because
; nothing about a logo changes with the language.
;//////////////////////////////////////////////////////////////////////////////

MappedImage ZuluGOLogo
  Texture = ZuluGOLogo.tga
  TextureWidth = 256
  TextureHeight = 256
  Coords = Left:0 Top:0 Right:256 Bottom:256
End
